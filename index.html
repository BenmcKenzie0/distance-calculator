<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distance Calculator</title>
<style>
body{font-family:Arial;background:#f0f9ff;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input,select{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
button{background:#0284c7;color:white;padding:12px 18px;border:0;border-radius:7px;cursor:pointer}
#result{background:#e0f2fe;padding:18px;margin-top:15px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Distance Calculator</h1>
<input id="distance" type="number" min="0" step="any" placeholder="Enter distance">
<select id="unit">
<option value="km">Kilometers</option>
<option value="m">Meters</option>
<option value="mi">Miles</option>
<option value="ft">Feet</option>
</select>
<button onclick="convert()">Convert Distance</button>
<div id="result">Conversion results appear here.</div>
</main>
<script>
function convert(){
 const field=document.getElementById("distance");
 const value=Number(field.value);
 const unit=document.getElementById("unit").value;
 const out=document.getElementById("result");
 if(field.value.trim()===""||!Number.isFinite(value)||value<0){
  out.textContent="Enter a valid non-negative distance.";
  return;
 }
 const factors={km:1000,m:1,mi:1609.344,ft:0.3048};
 const meters=value*factors[unit];
 out.textContent=
 `Meters: ${meters.toFixed(3)} | Kilometers: ${(meters/1000).toFixed(4)} | Miles: ${(meters/1609.344).toFixed(4)} | Feet: ${(meters/0.3048).toFixed(2)}`;
}
</script>
</body>
</html>
